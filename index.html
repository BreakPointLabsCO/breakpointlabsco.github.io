  }
  .veil{
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at 50% 20%, rgba(3,5,10,0) 0%, rgba(3,5,10,0.35) 70%, rgba(3,5,10,0.6) 100%);
    pointer-events:none;
    z-index:1;
  }
  .topbar{
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    align-items:center;
    padding:14px 6vw;
    padding-top:calc(14px + env(safe-area-inset-top,0px));
    background:linear-gradient(to bottom, rgba(3,5,10,0.85), rgba(3,5,10,0));
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:var(--ink);
  }
  .brand-logo{
    height:30px;
    width:auto;
    object-fit:contain;
  }
  @media (max-width:360px){
    .brand-name{ display:none; }
  }
  .brand-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:0.95rem;
    letter-spacing:0.01em;
  }
  .topbar{ justify-content:space-between; }
  .contact-btn{
    display:inline-flex;
    align-items:center;
    padding:8px 16px;
    border-radius:999px;
    border:1px solid var(--panel-border);
    background:var(--panel);
    color:var(--ink);
    text-decoration:none;
    font-size:0.82rem;
    white-space:nowrap;
    transition:border-color 0.15s ease, transform 0.15s ease;
  }
  .contact-btn:hover{ border-color:var(--glow-a); transform:translateY(-1px); }
  .tm-footer{
    position:relative;
    z-index:2;
    text-align:center;
    padding:1vh 6vw 4vh;
    color:var(--dim);
    font-size:0.72rem;
  }
  header{
    position:relative;
    z-index:2;
    text-align:center;
    padding:min(9vh, 64px) 6vw 2vh;
  }
  .hero-logo{
    max-width:min(260px, 60vw);
    height:auto;
    margin:0 auto 1rem;
    display:block;
  }
  header p{
    color:var(--dim);
    font-size:clamp(0.9rem,2vw,1.05rem);
    max-width:34rem;
    margin:0 auto;
    line-height:1.5;
  }
  .field{
    position:relative;
    width:100%;
    height:82vh;
    min-height:420px;
    z-index:2;
  }
  .star{
    position:absolute;
    transform:translate(-50%,-50%);
    width:34px;
    height:34px;
    cursor:pointer;
    z-index:3;
    -webkit-tap-highlight-color:transparent;
  }
  .star:focus{ outline:none; }
  .star:focus-visible .dot{ outline:2px solid var(--glow-a); outline-offset:4px; border-radius:50%; }
  .star .dot{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:8px;
    height:8px;
    border-radius:50%;
    background:#fff;
    box-shadow:
      0 0 6px 2px rgba(255,255,255,0.9),
      0 0 18px 6px var(--glow-a);
    animation:twinkle 3.2s ease-in-out infinite;
  }
  .star:nth-of-type(2n) .dot{ animation-delay:0.8s; box-shadow:0 0 6px 2px rgba(255,255,255,0.9), 0 0 18px 6px var(--glow-b);}
  .star:nth-of-type(3n) .dot{ animation-delay:1.6s; }
  @keyframes twinkle{
    0%,100%{ opacity:0.75; transform:translate(-50%,-50%) scale(1); }
    50%{ opacity:1; transform:translate(-50%,-50%) scale(1.35); }
  }
  .star::before{
    content:'';
    position:absolute;
    inset:-14px;
    border-radius:50%;
  }
  .card{
    position:absolute;
    bottom:calc(100% + 14px);
    left:50%;
    transform:translate(calc(-50% + var(--shift,0px)),6px);
    width:min(240px, 60vw);
    background:var(--panel);
    border:1px solid var(--panel-border);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-radius:10px;
    padding:12px 14px;
    text-align:left;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.18s ease, transform 0.18s ease;
  }
  .star.flip .card{
    bottom:auto;
    top:calc(100% + 14px);
    transform:translate(calc(-50% + var(--shift,0px)),-6px);
  }
  .star:hover .card,
  .star:focus-visible .card,
  .star.active .card{
    opacity:1;
    transform:translate(calc(-50% + var(--shift,0px)),0);
    pointer-events:auto;
  }
  .card h2{
    font-family:'Space Grotesk', sans-serif;
    font-size:0.95rem;
    font-weight:600;
    margin:0 0 4px;
    color:var(--ink);
  }
  .card p{
    font-size:0.8rem;
    line-height:1.4;
    color:var(--dim);
    margin:0 0 8px;
  }
  .card .visit{
    font-size:0.78rem;
    color:var(--glow-a);
    border-bottom:1px solid rgba(111,227,214,0.4);
  }
  footer{
    position:relative;
    z-index:2;
    text-align:center;
    padding:2vh 6vw 6vh;
    color:var(--dim);
    font-size:0.78rem;
  }
  @media (max-width:600px){
    .field{ height:70vh; }
    .card{ width:min(200px,66vw); padding:10px 12px; }
  }
  @media (max-height:480px){
    header{ padding:min(4vh, 28px) 6vw 1vh; }
    header p{ display:none; }
    .field{ height:60vh; min-height:280px; }
  }
  @media (prefers-reduced-motion: reduce){
    .dot{ animation:none; }
  }
</style>
</head>

<div class="field" id="field"></div>

<footer>
  Scroll the sky · more stars to come
  <div class="tm-footer" style="padding:0.6rem 0 0;">BreakPoint Labs&trade; · &copy; 2026</div>
</footer>

<script>
const stars = [
  {x:23, y:36, name:"Little Brain AI", desc:"A transparent language model that learns from every conversation.", href:"project-1.html"},
  {x:61, y:24, name:"Coming soon", desc:"Check back later.", href:"#"},
  {x:85, y:49, name:"Coming soon", desc:"Check back later.", href:"#"},
  {x:11, y:64, name:"Coming soon", desc:"Check back later.", href:"#"},
  {x:74, y:71, name:"Coming soon", desc:"Check back later.", href:"#"},
  {x:61, y:87, name:"Coming soon", desc:"Check back later.", href:"#"}
];

const field = document.getElementById('field');

const LONG_PRESS_MS = 450;

stars.forEach((s) => {
  const btn = document.createElement('div');
  btn.className = 'star';
  btn.style.left = s.x + '%';
  btn.style.top = s.y + '%';
  btn.tabIndex = 0;
  btn.setAttribute('role', 'link');
  btn.setAttribute('aria-label', s.name + ' — ' + s.desc);
  btn.dataset.href = s.href;

  btn.innerHTML = `
    <span class="dot"></span>
    <span class="card">
      <h2>${s.name}</h2>
      <p>${s.desc}</p>
      <span class="visit">View project</span>
    </span>
  `;

  let revealed = false;
  let suppressClick = false;
  let pressTimer = null;

  function reveal(){
    revealed = true;
    btn.classList.add('active');
    closeOthers(btn);
    keepCardInView(btn);
  }
  function unreveal(){
    revealed = false;
    btn.classList.remove('active');
  }
  function go(){
    if (s.href && s.href !== '#') window.open(s.href, '_blank', 'noopener');
  }

  // desktop: hovering reveals; leaving hides again
  btn.addEventListener('mouseenter', reveal);
  btn.addEventListener('mouseleave', unreveal);
  btn.addEventListener('focus', reveal);
  btn.addEventListener('blur', unreveal);

  // touch: long-press reveals without navigating
  btn.addEventListener('touchstart', () => {
    pressTimer = setTimeout(() => {
      reveal();
      suppressClick = true;
    }, LONG_PRESS_MS);
  }, { passive: true });
  btn.addEventListener('touchend', () => clearTimeout(pressTimer));
  btn.addEventListener('touchmove', () => clearTimeout(pressTimer));

  // click/tap: first click reveals, click while already revealed navigates
  btn.addEventListener('click', (e) => {
    if (suppressClick) { suppressClick = false; return; }
    if (revealed) { go(); return; }
    e.preventDefault();
    reveal();
  });
  btn.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    if (revealed) go(); else reveal();
  });

  field.appendChild(btn);
});

function closeOthers(except){
  document.querySelectorAll('.star.active').forEach(s => { if (s !== except) s.classList.remove('active'); });
}

// nudge a card back into the viewport if it would spill off an edge
function keepCardInView(btn){
  const card = btn.querySelector('.card');
  btn.style.setProperty('--shift', '0px');
  btn.classList.remove('flip');

  const margin = 10;
  const rect = card.getBoundingClientRect();

  if (rect.top < margin) btn.classList.add('flip');

  const rect2 = card.getBoundingClientRect();
  let shift = 0;
  if (rect2.left < margin) shift = margin - rect2.left;
  else if (rect2.right > window.innerWidth - margin) shift = (window.innerWidth - margin) - rect2.right;
  btn.style.setProperty('--shift', shift + 'px');
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.star')) {
    document.querySelectorAll('.star.active').forEach(s => s.classList.remove('active'));
  }
});
</script>
