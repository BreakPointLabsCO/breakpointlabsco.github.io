  }
  .veil{
    position:fixed; inset:0;
    background:radial-gradient(ellipse at 50% 30%, rgba(3,5,10,0.1) 0%, rgba(3,5,10,0.6) 100%);
    pointer-events:none; z-index:0;
  }
  main{
    position:relative; z-index:1;
    max-width:32rem;
    margin:0 auto;
    padding:6vh 6vw;
    text-align:center;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:clamp(1.6rem,5vw,2.2rem);
    margin:0 0 1rem;
  }
  .desc{
    color:var(--dim);
    font-size:1rem;
    line-height:1.65;
    margin:0 0 2rem;
  }
  .links{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .links a{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 18px; border-radius:8px;
    border:1px solid var(--panel-border);
    background:var(--panel);
    color:var(--ink); text-decoration:none; font-size:0.9rem;
    transition:border-color 0.15s ease, transform 0.15s ease;
  }
  .links a:hover{ border-color:var(--glow-a); transform:translateY(-1px); }
  .topbar{
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    align-items:center;
    padding:14px 6vw;
    padding-top:calc(14px + env(safe-area-inset-top,0px));
    background:linear-gradient(to bottom, rgba(3,5,10,0.85), rgba(3,5,10,0));
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:var(--ink);
    overflow-x:hidden;
  }
  .brand-logo{
    height:30px;
    width:auto;
    object-fit:contain;
  }
  @media (max-width:360px){
    .brand-name{ display:none; }
  }
  .brand-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:0.95rem;
    letter-spacing:0.01em;
  }
  .topbar{ justify-content:space-between; }
  .contact-btn{
    display:inline-flex;
    align-items:center;
    padding:8px 16px;
    border-radius:999px;
    border:1px solid var(--panel-border);
    background:var(--panel);
    color:var(--ink);
    text-decoration:none;
    font-size:0.82rem;
    white-space:nowrap;
    transition:border-color 0.15s ease, transform 0.15s ease;
  }
  .contact-btn:hover{ border-color:var(--glow-a); transform:translateY(-1px); }
  .tm-footer{
    position:relative;
    z-index:2;
    text-align:center;
    padding:1vh 6vw 4vh;
    color:var(--dim);
    font-size:0.72rem;
  }
</style>
</head>
